name: Language package CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/language-package-ci.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "java/src/org/futo/inputmethod/latin/languagepack/**"
      - "java/src/org/futo/inputmethod/latin/uix/settings/SettingsNavigator.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevLanguagePackageInspector.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevLanguagePackageRegistry.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevSettings.kt"
      - "native/jni/**"
      - "tests/src/org/futo/inputmethod/latin/languagepack/**"
      - "tools/language-packages/**"
      - "docs/language-packages/**"
  pull_request:
    paths:
      - ".github/workflows/language-package-ci.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "java/src/org/futo/inputmethod/latin/languagepack/**"
      - "java/src/org/futo/inputmethod/latin/uix/settings/SettingsNavigator.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevLanguagePackageInspector.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevLanguagePackageRegistry.kt"
      - "java/src/org/futo/inputmethod/latin/uix/settings/pages/DevSettings.kt"
      - "native/jni/**"
      - "tests/src/org/futo/inputmethod/latin/languagepack/**"
      - "tools/language-packages/**"
      - "docs/language-packages/**"

permissions:
  contents: read

concurrency:
  group: language-package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile unstable debug and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate portable package builder
        run: |
          python3 -m py_compile tools/language-packages/create-example-package.py
          python3 tools/language-packages/create-example-package.py build/language-packages/ci-example.futolanguage
          test -s build/language-packages/ci-example.futolanguage

      - name: Compile application and instrumentation tests
        run: |
          chmod +x gradlew
          ./gradlew \
            assembleUnstableDebug \
            assembleUnstableDebugAndroidTest \
            --stacktrace \
            --no-daemon
