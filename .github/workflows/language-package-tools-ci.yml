name: Language package tools CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/language-package-tools-ci.yml"
      - "tools/language-packages/**"
  pull_request:
    paths:
      - ".github/workflows/language-package-tools-ci.yml"
      - "tools/language-packages/**"

permissions:
  contents: read

concurrency:
  group: language-package-tools-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test portable Python tools
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile tools
        shell: bash
        run: |
          python -m py_compile tools/language-packages/*.py

      - name: Run tool tests
        shell: bash
        run: |
          python -m unittest discover \
            -s tools/language-packages \
            -p "test_*.py" \
            -v
